version: 1.0.3+103

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_riverpod: ^2.5.1
  qr_flutter: ^4.1.0
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.0
