name: CI Engine & App Tests

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'feeds/feed.v1.json'
      - 'rules/**'
  pull_request:
    branches: [ main ]

jobs:
  go-engine-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Run Go Engine Tests
        working-directory: engine
        run: go test -v ./...
      - name: Run Go Vet
        working-directory: engine
        run: go vet ./...
      - name: Compile Android mobile bridge
        if: matrix.os == 'ubuntu-latest'
        working-directory: engine
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '0'
        run: go build -tags 'with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_clash_api,badlinkname,tfogo_checklinkname0' ./mobile
      - name: Run Go Feed Generator Tests
        working-directory: feeds
        run: go test -v ./...

  config-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Download pinned sing-box and Xray
        run: |
          curl -fsSL -o /tmp/sb.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64.tar.gz"
          tar -xzf /tmp/sb.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sing-box-1.14.4-linux-amd64/sing-box /usr/local/bin/sing-box
          curl -fsSL -o /tmp/xray.zip "https://github.com/XTLS/Xray-core/releases/download/v26.11.9/Xray-linux-64.zip"
          unzip -q /tmp/xray.zip -d /tmp/xray
          sudo install -m 0755 /tmp/xray/xray /usr/local/bin/xray
      - name: Validate generated sing-box and Xray configs
        working-directory: engine
        env:
          SINGBOX_BIN: /usr/local/bin/sing-box
          XRAY_BIN: /usr/local/bin/xray
        run: go test -v ./pkg/cores ./pkg/orchestrator

  flutter-app-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Analyze & Test Flutter App
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test -r expanded
