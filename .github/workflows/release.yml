name: Release MLZ VPN (Windows & Android)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build Windows mlz-engine.exe
        working-directory: engine
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -ldflags="-s -w -H=windowsgui" -o bin\mlz-engine.exe .\cmd\mlz-engine

      - name: Build Windows Flutter Release
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Bundle mlz-engine, sing-box, xray-core & Iran .srs Rules
        shell: pwsh
        run: |
          $relDir = "app\build\windows\x64\runner\Release"
          $coresDir = "$relDir\cores"
          $rulesDir = "$relDir\rules"
          New-Item -ItemType Directory -Force -Path $coresDir, $rulesDir | Out-Null

          Copy-Item "engine\bin\mlz-engine.exe" "$relDir\mlz-engine.exe" -Force

          $sbRel = Invoke-RestMethod "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $sbAsset = $sbRel.assets | Where-Object { $_.name -match "windows-amd64\.zip$" } | Select-Object -First 1
          if ($sbAsset) {
            Invoke-WebRequest -Uri $sbAsset.browser_download_url -OutFile "$env:TEMP\sb.zip"
            Expand-Archive "$env:TEMP\sb.zip" -DestinationPath "$env:TEMP\sb" -Force
            Get-ChildItem "$env:TEMP\sb" -Recurse -Filter "sing-box.exe" | Select-Object -First 1 | Copy-Item -Destination "$coresDir\sing-box.exe" -Force
          }

          $xrRel = Invoke-RestMethod "https://api.github.com/repos/XTLS/Xray-core/releases/latest"
          $xrAsset = $xrRel.assets | Where-Object { $_.name -match "Xray-windows-64\.zip$" } | Select-Object -First 1
          if ($xrAsset) {
            Invoke-WebRequest -Uri $xrAsset.browser_download_url -OutFile "$env:TEMP\xray.zip"
            Expand-Archive "$env:TEMP\xray.zip" -DestinationPath "$env:TEMP\xray" -Force
            Get-ChildItem "$env:TEMP\xray" -Recurse -Filter "xray.exe" | Select-Object -First 1 | Copy-Item -Destination "$coresDir\xray.exe" -Force
          }

          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Chocolate4U/Iran-sing-box-rules/rule-set/geosite-ir.srs" -OutFile "$rulesDir\geosite-ir.srs"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/Chocolate4U/Iran-sing-box-rules/rule-set/geoip-ir.srs" -OutFile "$rulesDir\geoip-ir.srs"

          Compress-Archive -Path "$relDir\*" -DestinationPath "mlz-vpn-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: mlz-vpn-windows-x64.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Android NDK & Compile mlz-core.aar via gomobile
        working-directory: engine
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;27.0.12077973"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init
          go get golang.org/x/mobile/bind
          mkdir -p ../app/android/app/libs
          gomobile bind -v -androidapi 24 -target=android/arm64,android/arm,android/amd64 -o ../app/android/app/libs/mlz-core.aar ./mobile
          go mod tidy

      - name: Build Android Split & Universal APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../mlz-vpn-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-release.apk ../mlz-vpn-android-universal.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            mlz-vpn-android-arm64-v8a.apk
            mlz-vpn-android-universal.apk

  publish-release:
    needs: [ build-windows, build-android ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate SHA-256 Checksums & version.json
        run: |
          WIN_SHA=$(sha256sum dist/windows-x64/mlz-vpn-windows-x64.zip | awk '{print $1}')
          ARM_SHA=$(sha256sum dist/android-apks/mlz-vpn-android-arm64-v8a.apk | awk '{print $1}')
          UNI_SHA=$(sha256sum dist/android-apks/mlz-vpn-android-universal.apk | awk '{print $1}')
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ "$TAG" == "main" ]]; then TAG="v1.0.0"; fi
          VER="${TAG#v}"
          cat <<EOF > dist/version.json
          {
            "version": "$VER",
            "build_number": ${GITHUB_RUN_NUMBER},
            "min_supported_version": "1.0.0",
            "released_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "changelog_fa": [
              "انتشار نسخه $VER برای ویندوز و اندروید",
              "بهبود موتور ترکیبی sing-box + Xray-core و سایدکارهای All-In"
            ],
            "assets": {
              "windows_x64": {
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/mlz-vpn-windows-x64.zip",
                "sha256": "$WIN_SHA"
              },
              "android_arm64": {
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/mlz-vpn-android-arm64-v8a.apk",
                "sha256": "$ARM_SHA"
              },
              "android_universal": {
                "url": "https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG/mlz-vpn-android-universal.apk",
                "sha256": "$UNI_SHA"
              }
            }
          }
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/windows-x64/mlz-vpn-windows-x64.zip
            dist/android-apks/mlz-vpn-android-arm64-v8a.apk
            dist/android-apks/mlz-vpn-android-universal.apk
            dist/version.json
